# Per-route descents for the circuit direction (Popular End toward Stanage
# End). Sourced from guidebook topo arrows; see descents-notes.md for the
# full option list. Rendered in the transition row AFTER the route.
# Entries marked TBD await the user's filter pass. challenge.yaml wins.

Heather Wall: Chockstone chimney at the Grotto Slab/Manchester break, just ahead. Chockstone wobbles, care.
Gargoyle Buttress: Walk ahead past Tippler; Avalanche Gully right of Flying Buttress, easy.
Narrow Buttress: Adjacent Rusty Wall/Hollybush gully (awkward), or Easier Descent right of Leaning Buttress behind.
Via Media: Black Slab/Rusty Wall break, just ahead.
Central Trinity: Black Slab/Rusty Wall break behind; Hargreaves' is on this same slab.
Hargreaves' Original: Ahead to the Porthole (awkward, known accident spot) or back down the Black Slab/Rusty Wall break.
Inverted V: Porthole descent, adjacent (awkward, take care).
Ellis's Eliminate: Porthole descent, left of the buttress (awkward, take care).
Rubber Band: Porthole behind, or continue to the Robin Hood's Cave break ahead and drop back to the base.
Robin Hood's Cave Innominate: Break between Robin Hood's Cave and Twin Chimneys, just ahead.
Twin Chimneys Buttress: Same buttress as Via Roof Route; break behind (Robin Hood's Cave side) if needed.
Via Roof Route: Balcony descent ahead (often green) or the pinnacle gap just beyond.
Mississippi Buttress Direct: Mississippi/Heaven Crack gully, left of the buttress; Louisiana Rib is on this buttress.
The Louisiana Rib: Mississippi/Heaven Crack gully, adjacent.
Hell Crack: Heaven Crack descent gully behind the buttress's right end; Step-ladder is on this buttress.
Step-ladder Crack: Heaven Crack gully behind, then walk the base to Martello.
The Nose: Martello/Verandah break, just ahead (marked from both sides).
The Punk: "TBD: nothing marked at BAW's Crawl. Verandah break behind or first Plantation break ahead."
Cleft Wing Superdirect: Same buttress as Cleft Wing; walk the top.
Cleft Wing: "TBD: nothing marked at Dover's Wall. Head for Plantation; towers descent at Away from it All or Unconquerables ends."
Wall Buttress: Namenlos left end, just ahead.
Paradise Wall: Paradise Wall left end, adjacent.
Pegasus Wall: Same wall as Valhalla; walk the top.
Valhalla: "TBD: nothing marked on Pegasus Wall. Paradise left end behind, or informal break ahead."
Seesaw: "TBD: nothing marked at Hathersage Trip. Strangler-area descents if on the upper tier, else continue to the Fairy Steps notch."
Fairy Steps: Notch immediately right of the buttress, then along the base.
Wall End Slab: Adjacent gap right of the slab (marked awkward), or walk the top to Fern Crack buttress.
Fern Crack: Fern buttress left end, just ahead; more options at the D.I.Y. Area.
Count's Crack: Count's Buttress left end, adjacent.
Central Buttress: Enclosure Buttress left end, just ahead.
Titanic: Titanic buttress left end, just ahead (Blockhead break variant is awkward).
High Neb Buttress: Marked scramble-descent notch immediately right of the buttress, then the base.
Inaccessible Crack: Green groove just left of Inaccessible Slab, the easiest way off.
Cosmic Crack: Cosmic buttress left end, just ahead.
First Sister: Sisters wall right end, adjacent, or the Marble Wall breaks en route.
Crab Crawl Arete: Stanage End left end. Walk off, you're done.
