# Stanage VS Challenge (1989 Guide)
# Source: https://www.ukclimbing.com/logbook/ticklists/stanage_vs_challenge_1989_guide-437
# Grades shown are current UKC grades; the challenge is defined by the 1989 list
# (Via Roof Route and Wall Buttress are now HVS, Paradise Wall now HS).
#
# description: one or two lines read at speed (line, gear character).
# descent: way down after topping out; rendered in the transition row after the route.
# to_next: walk note to the next route in circuit order.
# topo: filename in topos/, shareable between routes.

name: Stanage VS Challenge (1989 Guide)
slug: stanage-vs
ukc_ticklist: https://www.ukclimbing.com/logbook/ticklists/stanage_vs_challenge_1989_guide-437
target_hours: 10
notes: >
  All the starred VS routes, 36 in total, from the 1989 definitive Stanage
  guide. Traditionally all routes led and seconded as a partner team in a
  day, no soloing. 76 stars, 538 m of climbing.

# Placeholder leader blocks; edit before the day.
leaders:
  - Leader 1
  - Leader 2
blocks:
  - from: 1
    leader: Leader 1
  - from: 11
    leader: Leader 2
  - from: 21
    leader: Leader 1
  - from: 29
    leader: Leader 2

