# One-liner route descriptions, condensed in our own words from the route
# info on UKC (Aug 2026). challenge.yaml description fields override these.

Heather Wall: Cracked face to a deeper crack; awkward pull to a ledge and scoop, then the easy right-hand corner.
Gargoyle Buttress: From the right toe, break out left; careful pull on the perched block, then the arete or wall above.
Narrow Buttress: Right arete, brief dodge to the left edge, back right to a juggy finish.
Via Media: Well-protected right-hand crack into a short chockstoned chimney.
Central Trinity: Crack to 6 m, step left into the continuation crack (hard entry), groove to finish.
Hargreaves' Original: Slab classic; up left from the boulder, traverse left, then the centre of the slab. Takes cams.
Inverted V: Polished crack and deep groove to the roof, then the exposed crack skirting it rightwards.
Ellis's Eliminate: Jamming test. Traverse the break to the nose, exposed juggy arete to finish.
Rubber Band: Staircase start, jam left along the high break, tricky arete finish.
Robin Hood's Cave Innominate: Thin finger-crack, delicate entry from the left (or hard direct mantel); slick feet up to the cave.
Twin Chimneys Buttress: Blunt arete with a bold slippery start and a detached block; eases above.
Via Roof Route: Hard thin crack into the cave, out to the roof, swing right to the easier wall.
Mississippi Buttress Direct: Leaning groove, awkward bulge, then the great flake crack, easing gradually.
The Louisiana Rib: Crack, traverse to the right arete, awkwardly up its left side, back left to finish.
Hell Crack: The bulging jam crack, direct. Overhang crux low down, well protected.
Step-ladder Crack: Awkward pull into the hanging crack right of Devil's Chimney, hard move, then rightwards to finish.
The Nose: Pumpy hand-traverse right along the low break to the arete.
The Punk: Hanging crack on the north face, hand-traversed in from the gully. Mind the ropework.
Cleft Wing Superdirect: Into the gloomy recess, hand-traverse the overhanging wall, swing round the arete. Feels bold.
Cleft Wing: Flake to the roof, flop across the gap, swing round the arete. Weird; unkind to the short.
Wall Buttress: Slanting layback then an improvised wide grovel, or the better centre jam crack.
Paradise Wall: Parallel jam cracks merging into one. Well protected; the soft touch of the list.
Pegasus Wall: Thin leftward cracks, awkward to reach, kinking right then left.
Valhalla: Straight crack gained from the left over a tricky wall. Short; jam or layback.
Seesaw: Left arete of the slab, from the left.
Fairy Steps: Delicate foot-traverse out left across the smooth wall. Not a place to wobble.
Wall End Slab: Chipped slab start, bulge right of the arete, step-down traverse to the right arete. Bold easy finish.
Fern Crack: The long crack. Slippery start, two awkward wide sections; stiff for the grade.
Count's Crack: Short traverse in from the right to the side-wall crack; classic jamming.
Central Buttress: Right past the roof, powerful pull left through the bulge, then a padding slab.
Titanic: Groove, traverse right to the arete, unlikely moves, final crack. Exciting finish.
High Neb Buttress: Rib to a ledge, crucial mantel onto the slab, airy arete.
Inaccessible Crack: Crack from the recess's right edge to its end, then traverse left to finish.
Cosmic Crack: Right-hand crack, good laybacking; soft for the grade.
First Sister: Left-hand of the twin cracks. Thin below, good jams above, awkward top-out.
Crab Crawl Arete: The arete throughout; balancy and a touch reachy.
